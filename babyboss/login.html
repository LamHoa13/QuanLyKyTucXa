<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Nhập</title>
  <style>
    :root {
      --primary-color: #4465c1;
      --secondary-color: #e6f7ff;
      --button-color: #4465c1;
      --footer-color: #0d2c83;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #d4f4f9, #d4f4f9);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: var(--primary-color);
      padding: 15px 30px;
      color: white;
      display: flex;
      align-items: center;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: bold;
      font-size: 16px;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 40px 35px;
      border-radius: 30px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 30px;
      color: var(--primary-color);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: var(--secondary-color);
      font-size: 15px;
    }

    button {
      background-color: var(--button-color);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3453a5;
    }

    .forgot-password {
      margin-top: 15px;
      display: block;
      color: var(--primary-color);
      font-size: 14px;
      text-decoration: none;
    }

    .error-message {
      color: red;
      margin-bottom: 10px;
      font-size: 14px;
    }

    footer {
      background-color: var(--footer-color);
      color: white;
      text-align: center;
      padding: 12px 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Trang Chủ</a>
    <a href="#">Đăng Nhập</a>
  </div>

  <div class="main">
    <div class="container">
      <h2>Đăng Nhập</h2>
      <div id="error" class="error-message"></div>
      <input type="text" id="username" placeholder="Tên đăng nhập" />
      <input type="password" id="password" placeholder="Mật khẩu" />
      <button onclick="login()">Đăng Nhập</button>
      <a href="#" class="forgot-password">Quên mật khẩu?</a>
    </div>
  </div>

  <footer>
    Địa chỉ: 178 Võ Thị Sáu, TP. Bạc Liêu | Email: tuyensinh@blu.edu.vn | ĐT: 0291.3821 107
  </footer>

  <script>
    function login() {
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value.trim();
      var error = document.getElementById("error");

      error.innerHTML = "";

      if (username === "") {
        error.innerHTML = "Vui lòng nhập tên đăng nhập.";
        return;
      }
      if (password === "") {
        error.innerHTML = "Vui lòng nhập mật khẩu.";
        return;
      }

      if (
        (username === "XuBin" && password === "17102004") ||
        (username === "dthien" && password === "123") ||
        (username === "hoanguy" && password === "123")
      ) {
        window.location.href = "Welcome.php";
      } else {
        error.innerHTML = "Tên đăng nhập hoặc mật khẩu không đúng.";
      }
    }
  </script>

</body>
</html>
