<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng Nhập</title>
  <style>
    :root {
      --primary: #4a69bd;
      --secondary: #f5f6fa;
      --text-dark: #2d3436;
      --error-color: #e74c3c;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dff9fb, #c7ecee);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: var(--primary);
      padding: 12px 30px;
      display: flex;
      justify-content: flex-start; /* Căn trái */
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-weight: 500;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #dff9fb;
    }

    .container {
      background: white;
      max-width: 400px;
      margin: 60px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3b5998;
    }

    .footer {
      background-color: #162e80;
      color: white;
      text-align: center;
      padding: 15px;
      position: fixed;
      width: 100%;
      bottom: 0;
      font-size: 14px;
    }

    .error {
      color: var(--error-color);
      font-size: 14px;
      margin-bottom: 5px;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: var(--primary);
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Trang Chủ</a>
    <a href="#">Đăng Nhập</a>
  </div>

  <div class="container">
    <h2>Đăng Nhập</h2>
    <input type="text" id="username" placeholder="Email hoặc Tên đăng nhập" />
    <p class="error" id="userError"></p>
    <input type="password" id="password" placeholder="Mật khẩu" />
    <p class="error" id="passError"></p>
    <button onclick="validateLogin()">Đăng Nhập</button>
    <a href="#">Quên mật khẩu?</a>
  </div>

  <div class="footer">
    Địa chỉ: 178 Võ Thị Sáu, TP. Bạc Liêu | Email: tuyensinh@blu.edu.vn | ĐT: 0291.3821 107
  </div>

  <script>
    function validateLogin() {
      let username = document.getElementById("username").value;
      let password = document.getElementById("password").value;
      let userError = document.getElementById("userError");
      let passError = document.getElementById("passError");

      userError.innerText = "";
      passError.innerText = "";

      if (username.trim() === "") {
        userError.innerText = "Vui lòng nhập email hoặc tên đăng nhập.";
        return;
      }
      if (password.trim() === "") {
        passError.innerText = "Vui lòng nhập mật khẩu.";
        return;
      }

      if ((username === "XuBin" && password === "17102004") ||
          (username === "dthien" && password === "123") || (username === "hoanguy" && password === "123")) {
        window.location.href = "Welcome.php?user=Admin&pass=Admin1234";
      } else {
        alert("Thông tin đăng nhập sai. Vui lòng thử lại.");
      }
    }
  </script>
</body>
</html>
